# Deploy the site to GitHub Pages.
#
# DISABLED until someone turns it on: set Settings → Pages → Source → GitHub Actions.
# GitHub Pages needs a public repository, or a paid plan for a private one.
#
# For a custom domain, uncomment the CNAME step below and point DNS at GitHub:
#   A     @      185.199.108.153 / .109.153 / .110.153 / .111.153
#   CNAME www    <account>.github.io
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - name: Set custom domain
      #   run: echo "7thapparel.com" > CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
